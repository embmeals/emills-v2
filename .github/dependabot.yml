version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
      tailwind:
        patterns:
          - "tailwindcss*"
          - "@tailwindcss/*"
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Major Angular version bumps should be intentional
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-devkit/*"
        update-types: ["version-update:semver-major"]
      # zone.js and TypeScript must stay in lockstep with Angular — never update independently
      - dependency-name: "zone.js"
      - dependency-name: "typescript"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 5
