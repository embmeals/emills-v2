name: Link Check

on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]
    branches: [main]
  schedule:
    # Run weekly on Mondays at 9am UTC to catch externally broken links
    - cron: '0 9 * * 1'

permissions:
  contents: read
  issues: write

jobs:
  link-check:
    name: Check for Broken Links
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - name: Run Lychee link checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --verbose
            --no-progress
            --exclude-loopback
            --exclude "mailto:"
            --exclude "localhost"
            --exclude "192\.168\."
            https://www.emills.net
          fail: false
      - name: Create issue on failure
        if: steps.lychee.outputs.exit_code != 0
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Broken links detected on www.emills.net';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'broken-links',
            });
            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: 'The weekly link check found broken links. Check the [workflow run](' +
                  `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` +
                  ') for details.',
                labels: ['broken-links'],
              });
            }
