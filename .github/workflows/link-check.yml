name: Link Check

on:
  workflow_run:
    workflows: [CI / CD]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9am UTC

jobs:
  link-check:
    name: Check for Broken Links
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      issues: write
    steps:
      - name: Run Lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --verbose
            --no-progress
            --exclude-loopback
            --exclude "mailto:"
            --exclude "localhost"
            --exclude "192\.168\."
            https://www.emills.net
          fail: false

      - name: Open issue if broken links found
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          open=$(gh issue list --repo ${{ github.repository }} --label broken-links --state open --json number --jq length)
          if [ "$open" = "0" ]; then
            gh issue create \
              --repo ${{ github.repository }} \
              --title "Broken links detected on www.emills.net" \
              --body "Link check found broken links. See [workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details." \
              --label "broken-links"
          fi
