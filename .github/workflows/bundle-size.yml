name: Bundle Size

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  bundle-size:
    name: Report Bundle Size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        run: npx ng build
      - name: Report bundle sizes
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const browserDir = 'dist/emills-v2/browser';
            const files = fs.readdirSync(browserDir);

            const formatBytes = (bytes) => {
              if (bytes < 1024) return `${bytes} B`;
              if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
              return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
            };

            const jsFiles = files
              .filter(f => f.endsWith('.js'))
              .map(f => {
                const stat = fs.statSync(path.join(browserDir, f));
                return { name: f, size: stat.size };
              })
              .sort((a, b) => b.size - a.size);

            const cssFiles = files
              .filter(f => f.endsWith('.css'))
              .map(f => {
                const stat = fs.statSync(path.join(browserDir, f));
                return { name: f, size: stat.size };
              })
              .sort((a, b) => b.size - a.size);

            const totalJs = jsFiles.reduce((sum, f) => sum + f.size, 0);
            const totalCss = cssFiles.reduce((sum, f) => sum + f.size, 0);

            const jsRows = jsFiles.map(f => `| \`${f.name}\` | ${formatBytes(f.size)} |`).join('\n');
            const cssRows = cssFiles.map(f => `| \`${f.name}\` | ${formatBytes(f.size)} |`).join('\n');

            const body = [
              '## Bundle Size Report',
              '',
              '### JavaScript',
              `| File | Size |`,
              `|------|------|`,
              jsRows,
              `| **Total** | **${formatBytes(totalJs)}** |`,
              '',
              '### CSS',
              `| File | Size |`,
              `|------|------|`,
              cssRows,
              `| **Total** | **${formatBytes(totalCss)}** |`,
              '',
              `> Built from commit ${context.sha.slice(0, 7)}`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.startsWith('## Bundle Size Report')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
